<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: {{WALL}}; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* The wall colour at the frame's right edge: what shows when the speaker reframes left for a panel. */
      #plate { position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse 70% 90% at {{PLATE_AT}}, {{WALL_LIGHT}} 0%, {{WALL}} 55%, {{WALL_DARK}} 100%); }
      #spk { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: {{FACE}}; z-index: 1; }
      /* Cutout of the speaker above a card they stand in front of (same transforms as #spk). */
      .spkc { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: {{FACE}}; pointer-events: none;
        /* Only the side that overlaps the card is needed; this drops the wall shadow the matte keeps on the other side. */
        -webkit-mask-image: linear-gradient(90deg, transparent {{MASK_FROM}}px, #000 {{MASK_TO}}px);
        mask-image: linear-gradient(90deg, transparent {{MASK_FROM}}px, #000 {{MASK_TO}}px); }
      .spkc video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
      #footage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
      /* Soft edge that blends the footage's right side into the plate while the speaker is reframed. */
      #edge { position: absolute; left: 1700px; top: 0; width: 2600px; height: 1080px; opacity: 0;
        background: linear-gradient(90deg, {{WALL_CLEAR}} 0px, {{WALL}} 220px); }
      /* Graphic wrappers: laid out with transforms from the top-left corner (full / right panel / card). */
      .gw { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; overflow: hidden;
        transform-origin: 0 0; box-shadow: 0 50px 140px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.35); background: {{CARD}}; }
      /* Inner layer of a paced clip: a very slow drift so held frames never look frozen. */
      .gi { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
      .gw video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- {{TITLE}}: the edited video with its finished motion-graphic clips (assets/gfx) on top.
         Generated by the edit-video engine (build.py) from plan.py; edit the plan, not this file. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-fps="30"
      data-width="1920" data-height="1080">
      <div id="plate" data-layout-ignore></div>
      <div id="spk">
        <video id="footage" class="clip" src="{{FOOTAGE_SRC}}" data-start="0" data-duration="{{FOOTAGE}}"
          data-track-index="0" data-has-audio="true" playsinline data-layout-allow-occlusion></video>
        <div id="edge" data-layout-allow-overflow></div>
      </div>
<!--GRAPHICS-->
<!--SFX-->
    </div>
    <script>
      const EDL = /*EDL*/[];
      const SPK = "#spk, .spkc";   // the footage and its cutout layers move as one
      const F = (frames) => frames / 30;
      const tl = gsap.timeline({ paused: true });

      // ---- layouts (wrapper transforms from its top-left corner) --------------------------------
      const LAY = { full: { x: 0, y: 0, scale: 1, borderRadius: 0 } };
      // A layout scaled by k around its own centre (pop-ins, pop-outs, zoom takeovers).
      const around = (L, k) => {
        const w = 1920 * L.scale, h = 1080 * L.scale, s = L.scale * k;
        return { x: L.x + w / 2 - (1920 * s) / 2, y: L.y + h / 2 - (1080 * s) / 2, scale: s, borderRadius: L.borderRadius / k };
      };
      // Every tween states its start values and never pre-renders, so the timeline is seek-safe in any order.
      const move = (target, from, to, at, frames, ease) =>
        tl.fromTo(target, from, { ...to, duration: F(frames), ease, immediateRender: false }, at);

      // ---- the speaker: reframe left for panels/cards, zoom for takeovers ---------------------------
      const S = { x: 0 };
      const shiftTo = (to, at, frames = 14) => {
        if (to === S.x) return;
        move(SPK, { x: S.x }, { x: to }, at, frames, "power3.inOut");
        move("#edge", { opacity: S.x < 0 ? 1 : 0 }, { opacity: to < 0 ? 1 : 0 }, at, frames, "power2.inOut");
        S.x = to;
      };
      const snapShift = (to, at) => {   // only while a full-screen graphic hides her
        tl.set(SPK, { x: to, scale: 1, skewX: 0 }, at);
        tl.set("#edge", { opacity: to < 0 ? 1 : 0 }, at);
        S.x = to;
      };

      // T5 Panel → full screen: the same clip keeps playing while it grows to fill the frame.
      // zoomExpand: the speaker pushes in behind it at the same time, so it reads as a zoom into the graphic.
      const expand = (g, w, L) => {
        move(w, { ...L }, { ...LAY.full }, g.expandAt, 18, "power3.inOut");
        if (g.zoomExpand) move(SPK, { scale: 1 }, { scale: 1.12 }, g.expandAt, 18, "power3.inOut");
        snapShift(0, g.expandAt + F(18) + 0.001);
        g.cur = LAY.full;
      };

      // Every panel/card carries its own layout ("lay": [x, y, scale]) and reframe ("shift").
      const layOf = (g) => ({ x: g.lay[0], y: g.lay[1], scale: g.lay[2], borderRadius: 24 / g.lay[2] });

      // ---- entrances ---------------------------------------------------------------------------------
      const ENTER = {
        // T2 Cinematic zoom takeover: the speaker pushes in while the graphic settles from 112 % into full frame.
        zoom(g, w, frames = 12) {
          move(w, { ...around(LAY.full, 1.12), opacity: 0 }, { ...LAY.full, opacity: 1 }, g.start, frames, "power3.out");
          move(SPK, { scale: 1 }, { scale: 1.14 }, g.start, frames, "power2.in");
          snapShift(0, g.start + F(frames) + 0.001);
          g.cur = LAY.full;
        },
        // T2 slow zoom: same takeover, then a slow push across the whole graphic (closing line).
        "slow-zoom"(g, w) {
          ENTER.zoom(g, w, 18);
          const end = g.windowEnd - (g.exit === "fade" ? F(8) : 0);
          move(w, { ...LAY.full }, { ...around(LAY.full, 1.045) }, g.start + F(18), (end - g.start - F(18)) * 30, "none");
          g.cur = around(LAY.full, 1.045);
        },
        // T4 Controlled whip pan: footage and graphic travel together, fast, with a hint of skew for speed.
        whip(g, w) {
          move(w, { ...LAY.full, x: 1920, skewX: -7, opacity: 1 }, { ...LAY.full, x: 0, skewX: 0, opacity: 1 }, g.start, 9, "power4.inOut");
          move(SPK, { x: S.x, skewX: 0 }, { x: S.x - 1920, skewX: -7 }, g.start, 9, "power4.inOut");
          snapShift(0, g.start + F(9) + 0.001);
          g.cur = LAY.full;
        },
        // T1 Full-screen slide: the graphic slides over from the right, the speaker (or the graphic before) drifts left.
        push(g, w) {
          move(w, { ...LAY.full, x: 1920, opacity: 1 }, { ...LAY.full, opacity: 1 }, g.start, 15, "power3.inOut");
          move(SPK, { x: S.x }, { x: S.x - 640 }, g.start, 15, "power3.inOut");
          snapShift(0, g.start + F(15) + 0.001);
          g.cur = LAY.full;
        },
        // T3 Floating card pop-in: the speaker reframes left, the card grows in beside them.
        pop(g, w) {
          const L = layOf(g);
          if (!g.shiftReady) shiftTo(g.shift, g.start, 13);
          move(w, { ...around(L, 0.86), opacity: 0 }, { ...L, opacity: 1 }, g.start + F(2), 12, "power3.out");
          g.cur = L;
          if (g.expandAt) expand(g, w, L);
        },
        // T1 Smooth slide & reframe: the speaker moves left as the panel slides in from the right edge.
        slide(g, w) {
          const L = layOf(g);
          if (!g.shiftReady) shiftTo(g.shift, g.start, 14);
          move(w, { ...L, x: 1960, opacity: 1 }, { ...L, opacity: 1 }, g.start, 14, "power3.out");
          g.cur = L;
          if (g.expandAt) expand(g, w, L);
        },
        // Iris: the full-screen graphic opens out of a circle (here: out of the panel it replaces).
        iris(g, w) {
          const [cx, cy] = g.irisAt;
          move(w, { ...LAY.full, opacity: 1, clipPath: `circle(0px at ${cx}px ${cy}px)` },
            { ...LAY.full, opacity: 1, clipPath: `circle(2300px at ${cx}px ${cy}px)` }, g.start, 16, "power3.inOut");
          move(SPK, { scale: 1 }, { scale: 1.06 }, g.start, 16, "power2.inOut");
          snapShift(0, g.start + F(16) + 0.001);
          g.cur = LAY.full;
        },
      };

      // ---- exits ------------------------------------------------------------------------------------
      const EXIT = {
        // Quick crossfade back to the speaker (6–8 frames) with a small settle so the cut feels intentional.
        fade(g, w, at) {
          move(w, { ...g.cur, opacity: 1 }, { ...around(g.cur, 1.04), opacity: 0 }, at, 8, "power2.in");
          move(SPK, { scale: 1.05 }, { scale: 1 }, at, 10, "power2.out");
        },
        // Same crossfade, but the speaker is already reframed for the panel/card that follows.
        "fade-to"(g, w, at) {
          snapShift(g.nextShift, at - 0.001);
          EXIT.fade(g, w, at);
        },
        // The card shrinks away; the speaker stays reframed because the next panel takes its place.
        "pop-to"(g, w, at) {
          move(w, { ...g.cur, opacity: 1 }, { ...around(g.cur, 0.9), opacity: 0 }, at, 9, "power2.in");
        },
        "slide-out"(g, w, at) {
          move(w, { ...g.cur }, { ...g.cur, x: 1960 }, at, 13, "power3.in");
          shiftTo(0, at + F(2), 14);
        },
        "pop-out"(g, w, at) {
          move(w, { ...g.cur, opacity: 1 }, { ...around(g.cur, 0.9), opacity: 0 }, at, 9, "power2.in");
          shiftTo(0, at + F(1), 12);
        },
        // The next graphic takes over on top; drop this one once that is fully in.
        cover(g, w) { tl.set(w, { opacity: 0 }, g.windowEnd); },
        end() {},
      };

      for (const g of EDL) {
        const w = `#w${g.id}`;
        ENTER[g.enter](g, w);
        // The speaker's cutout layer fades out when the panel grows to fill the frame.
        if (g.cutout?.fadeOut != null)
          move(`#spkc${g.id}`, { opacity: 1 }, { opacity: 0 }, g.cutout.fadeOut, g.cutout.fadeFrames ?? 8, "power1.inOut");
        if (g.pieces) move(`#gi${g.id}`, { scale: 1 }, { scale: 1.02 }, g.start, (g.windowEnd - g.start) * 30, "none");
        EXIT[g.exit](g, w, g.exitAt);
      }
      tl.set({}, {}, {{DURATION}});
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
